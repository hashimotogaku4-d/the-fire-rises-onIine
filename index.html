 if(S.stage=='target'||S.stage=='cell'||S.stage=='quake2'){if(S.second){S.second=0;return done(s)}S.stage='act';S.tg=null;S.cells=null}
 else if(S.stage=='act'){s.r=S.orig[0];s.c=S.orig[1];s.cur=S.cp;S.stage='move';S.reachSet=reach(s)}
 else{S.sel=S.stage=S.reachSet=null}
 render()}

let ALLC=[],ONLYMIL=false;function aiBest(){const b=aiBest0();if(b&&Math.random()<DIFF[S.diff].blunder&&ALLC.length)return ALLC[Math.random()*ALLC.length|0];return b}
function aiBest0(){ALLC=[];
 let best=null,bs=-1e9;
 const foes=S.U.filter(x=>x.s=='a');
 for(const u of S.U){if(u.s!='b'||u.done||(ONLYMIL&&!FREE(u.t)))continue;const st=ST[u.t];
  for(const[key,dist]of reach(u)){const[r,c]=key.split(',').map(Number);
   const gd=gdist(r,c);
   const nd=Math.min(...foes.map(x=>Math.abs(x.r-r)+Math.abs(x.c-c)));
   const pos=(goal(r,c)?4:0)-.35*gd-(st.rng>1?.05:.15)*nd+Math.random()*DIFF[S.diff].noise-DIFF[S.diff].safe*danger(u,r,c);
   const o=[{act:'wait',s:pos}];
   for(const a of atks(u))tg(u,r,c,'atk',a.rng).forEach(t=>{const d=dmg(u,t,a,Math.abs(t.r-r)+Math.abs(t.c-c));o.push({act:'atk',t,a,s:pos+d*3+(d>=t.hp?20:0)-(a.i>=0&&a.atk>=17?4:0)})});
   (st.heal?tg(u,r,c,'heal'):[]).forEach(t=>o.push({act:'heal',t,s:pos+Math.min(Math.ceil(t.max*.25),t.max-t.hp)*2.5}));
   for(const x of o){const cd={u,r,c,dist,a:x.a,act:x.act,t:x.t};ALLC.push(cd);if(x.s>bs){bs=x.s;best=cd}}}}
 return best}
function aiRemove(u,rem){
 let best=null,bs=-1e9;const foes=S.U.filter(x=>x.s=='a');
 for(const[key]of reach(u,rem)){const[r,c]=key.split(',').map(Number);
  const gd=gdist(r,c);
  const nd=foes.length?Math.min(...foes.map(x=>Math.abs(x.r-r)+Math.abs(x.c-c))):0;
  const s=(goal(r,c)?4:0)-.35*gd+.1*Math.min(nd,4)+Math.random()*.3;
  if(s>bs){bs=s;best=[r,c]}}
 if(best){const fr=u.r,fc=u.c;u.r=best[0];u.c=best[1];curse(u,fr,fc);log(nm(u)+'は再移動')}}
function cpu(){if(S.mode!='ai')return;
 S.busy=true;let n=0;
 const step=()=>{if(S.paused){setTimeout(step,500);return}
  if(S.ph!='battle')return;
  ONLYMIL=n>=S.lim;const b=aiBest();
  if(!b){S.busy=false;return endTurn()}
  const fr0=b.u.r,fc0=b.u.c;b.u.r=b.r;b.u.c=b.c;curse(b.u,fr0,fc0);
  if(b.act=='atk'){attack(b.u,b.t,b.a);if(S.U.includes(b.u)&&doc(b.u.s)=='comet'&&ST[b.u.t].cls=='rng'){const t2=tg(b.u,b.u.r,b.u.c,'atk');if(t2.length)attack(b.u,t2.sort((p,q)=>p.hp-q.hp)[0],{atk:ST[b.u.t].atk,i:-1,half:1})}if(S.U.includes(b.u)&&ST[b.u.t].rem&&remOf(b.u,b.dist)>0)aiRemove(b.u,remOf(b.u,b.dist))}else if(b.act=='heal')heal(b.u,b.t);else log(nm(b.u)+'は待機');
  b.u.done=true;if(!FREE(b.u.t))n++;
  if(wipe()){S.busy=false;return render()}
  render();setTimeout(step,700)};
 setTimeout(step,800)}

 return `<div class="rl"><h3>🏆 勝利条件</h3><p>全${TURNS}ターン終了時に、黄色の「勝敗判定エリア」内にいるキャラの数が多い方の勝ちです（同数なら引き分け）。途中で相手を全滅させた場合は、その時点で勝利です。</p><h3>🗺 マップ</h3><ul><li>盤面は横8×縦6マス。下側の紫が<b>自陣</b>、上側の青が<b>敵陣</b>、中央の黄色が<b>勝敗判定エリア</b>です。</li><li><b>壁</b>：マスとマスの境目にある茶色の線。壁をまたぐ移動はできません。</li><li><b>湖</b>：青い波のマス。進入できません（マップによって、川の水・ビル・溶岩になります）。</li><li><b>マップは4種類</b>：城塞（壁と湖）、川（橋が判定エリア）、都市（ビルとバリケード）、火山（中央に溶岩の火口）。出撃キャラを選ぶ画面で切り替えられます。</li></ul><h3>🎴 準備フェーズ</h3><ul><li>6種類のキャラから${TEAM}体を選びます（同じキャラを複数選べます）。</li><li>選んだキャラを、紫の自陣のマスに自由に配置します。敵はAIがランダムに編成し、青の敵陣に配置します。</li><li><b>2人対戦モード</b>：プレイヤー1（紫）→プレイヤー2（青）の順に、1台のiPadで準備します。交代の画面が入るので、相手の選択と配置は見えません。</li></ul><h3>⚔ 戦闘フェーズ</h3><ul><li>先攻・後攻はランダムに決まり、自軍と敵軍が交互にターンを行います。</li><li>1ターンに動かせるキャラは<b>最大3体</b>（ストラテジーは4体。ただし先攻の最初のターンだけ3体）。1体につき1回。ターンは合計${TURNS}回で、敵味方の番を合わせて数えます。</li><li>1体の行動は、まず<b>移動</b>し、そのあと<b>ファイト・待機・特殊行動</b>から1つを選びます。移動せずその場にとどまってもかまいません。</li><li>移動は、キャラごとの<b>移動力</b>の数だけ、上下左右に1マスずつ進めます（斜めは不可）。</li></ul><h3>💥 ファイト（攻撃）</h3><ul><li>射程内の敵を1体選んで攻撃します。<b>射程</b>は上下左右の距離の合計で数え、斜めのマスは2マス分です。</li><li>ダメージ ＝ 攻撃側の<b>攻撃力 − 防御側の防御力</b>（最低1）。HPが0になったキャラは消滅します。反撃はありません。</li><li>壁をはさんだ攻撃は、<b>ボウナイト・ロングボウ兵・モンク</b>だけができます。他のキャラは、壁のないマスから隣接して攻撃します。</li></ul><h3>✨ 特殊行動：ヒール</h3><p>モンクだけが使えます。射程内の味方（自分以外）1体のHPを、その味方の最大HPの25%（小数点以下切り上げ）回復します。</p><h3>📊 キャラ一覧</h3><table><tr><th>キャラ</th><th>HP</th><th>攻撃</th><th>防御</th><th>移動</th><th>射程</th></tr>${rows}</table>${traits()}<h3>📜 ドクトリン</h3><p>先攻・後攻が決まったあと、マップ選択の前に、それぞれ4種類のうち1つを選びます。選んだ内容（ドクトリン・戦闘精神）は相手には見えません。試合中のプレイヤー欄には「📜？」と表示され、結果画面で公開されます（2人対戦では「👁 確認」で自分の分だけ見られます）。</p><ul><li><b>ナイトチャージ</b>：各前線兵は初回攻撃時に攻撃+5を得ます（ナイトは+8）。ただしその後、最初に受けるダメージは2倍になります。常に、全前線兵の防御+1。</li><li><b>飛行編隊</b>：飛行兵の移動+1、攻撃力+3。ただし飛行兵は弓（ボウナイト・ロングボウ兵）から受けるダメージが+2されます。</li><li><b>大量突撃</b>：開戦時に市民兵が3体、盤面のランダムなマスに出現します（相手の陣地を除く）。市民兵は1ターンの操作枠に数えません。</li><li><b>アイアンコメート</b>：遠距離兵は1回の行動で2回攻撃できます（2回目は攻撃力半分）。常に、全遠距離兵の攻撃+1。さらに技「狙撃」（距離減衰を無視・攻撃力+2・射程4・1回だけ）が使えます。</li></ul><h3>🎲 試合前の流れ</h3><ul><li>① 先攻・後攻をランダム決定 → ② 「将校団精神」ページでドクトリン（ストラテジーは戦闘精神も）を先攻、後攻の順に選択（最初に、有無や使用キャラ数6／8体を設定できます） → ③ 先攻がマップを1つBAN、後攻が残りから選択 → ④ キャラを選び、配置（置いた側の陣地は、開戦まで黒く隠れます） → ⑤ 戦闘開始。</li></ul><h3>🏰 ストラテジーモード</h3><ul><li>縦9×横14の大規模マップ（イエナ・アレクサンドリア・カルパティア・ボロディノ）で6体または8体を選び、16ターンで戦います。アレクサンドリアはエジプトの砂漠、ボロディノはロシアの雪原です。</li><li><b>森</b>：ペガサス以外は入れます。中にいる間、防御力が1.3倍。</li><li><b>バフ・デバフ表示</b>：キャラの左上に、攻撃・防御の強化の合計が赤字（▲）、弱体化の合計が青字（▼）で常に表示されます。</li><li><b>市街地・川</b>：入れず、止まれません（ペガサスは飛び越えられます）。</li><li><b>橋</b>：川の上を全ユニットが通れます。</li><li><b>山</b>：全ユニットが入れます。騎兵（ナイト・ボウナイト・ペガサス）は山の上では移動1マスになり、攻撃が2下がります。</li></ul><h3>🔥 戦闘精神（ストラテジー専用）</h3><ul><li><b>英雄信仰</b>：ナイト・ボウナイト・カルタゴ騎兵・ペガサスナイトが敵を倒した時、味方全員のHPが全回復し、HP上限が1上がります。</li><li><b>群狼戦術</b>：周囲1マス（斜めを含む）に味方がいないユニットは、防御と攻撃が+5。</li><li><b>律令旅団</b>：上下左右に隣接する味方1体につき、防御+3。</li><li><b>宗教的騎士団</b>：モンクの数×2を、全ユニットの攻撃に加算。</li><li><b>蛮族攻撃への回帰</b>：攻撃するたび自分が3ダメージ（確定）を受ける代わりに、攻撃力+10。</li><li><b>悪魔崇拝者の陰謀</b>：開戦時に盤面の4か所にカラスが現れます（自分のカラスは紫、相手のカラスは青の輪で見分けられます）。そこを通った敵ユニットは、防御-5・攻撃-2（以後ずっと）。カラスは1回通過されると消えます。</li></ul><h3>🎚 AIの難易度</h3><p>対AI戦では、小作農・地主・騎士・貴族・王族の5段階から選べます。後になるほど、ミスが減り、危険なマスを避け、確実に狙ってきます。</p><h3>📊 戦闘予測とプレイヤーUI</h3><ul><li>キャラを選ぶと、攻撃できる敵の上に、与えるダメージの予測（赤い数字）が出ます。倒せる場合は「撃破」と表示されます。</li><li>画面の上下にプレイヤー欄があり、ドクトリン・戦闘精神・生存数・金エリア内の人数が見えます。2人対戦では、上側が相手向きに回転し、自分の番の操作は自分側で行います。</li></ul><h3>🕹 操作方法</h3><ul><li>動かすキャラをタップ → 光る点のマスをタップして移動 → ボタンで行動を選び、赤枠の敵（ヒールは緑枠の味方）をタップします。</li><li>「ターン終了」で、3体動かす前にターンを終えられます。</li><li>移動先を選んだあと、自分のキャラをもう一度タップすると待機。攻撃範囲内の敵をタップすると、攻撃の選択に進みます。</li><li>各ターンの持ち時間は1分30秒です（0になるとターン終了）。「⏸ ポーズ」で一時停止できます（盤面は隠れます）。</li></ul><button onclick="init()">メニューへ戻る</button></div>`}
function panel(){
 if(S.paused)return pauseHTML();if(S.ph=='hand2')return hand2HTML();if(S.ph=='opts')return optsHTML();if(S.ph=='corps')return corpsHTML();if(S.ph=='diff')return diffHTML();if(S.ph=='spirit')return spHTML();if(S.ph=='toss')return tossHTML();if(S.ph=='doc')return docHTML();if(S.ph=='ban')return banHTML();if(S.ph=='hand')return handHTML();if(S.ph=='menu')return menuHTML();if(S.ph=='rules')return rulesHTML();

   return `<div class="cd"><div class="em">${s.e}</div><div><b>${s.n}</b><br><small><span class="cl c-${s.cls}">${CLS[s.cls]}</span> HP${s.hp} 攻${s.atk} 防${s.def} 移${s.mv} 射${s.rng}${s.fly?'｜障害物無視':''}${s.pierce?'｜壁越し攻撃可':''}${s.sk?'｜技：'+s.sk.map(k=>k.n+'(攻'+k.atk+'・射'+k.rng+'・'+k.uses+'回)').join('、'):''}${s.n=='ロングボウ兵'?'｜3マス先は威力3/4、4マス先は半減':''}${s.evade?'｜遠距離攻撃キャラ以外から攻撃されない（飛行兵同士は可）':''}${s.note?'｜'+s.note:''}${s.rem?'｜攻撃後、余った移動力で再移動（待機のみ）':''}${s.heal?'｜特殊：ヒール（味方HP25%回復）':''}</small></div><div class="ct"><button onclick="pk('${t}',-1)">−</button><span>${S.cnt[t]}</span><button onclick="pk('${t}',1)">＋</button></div></div>`}).join('')
   +`<button ${n==TEAM?'':'disabled'} onclick="toPlace()" style="margin-top:8px">陣地への配置へ</button><button onclick="init()">メニューへ</button>`;
 }else if(S.ph=='place'){
  h='<b>'+whoL()+'② '+(S.who=='a'?'紫':'青')+'の自陣に配置</b>（光る点のマスをタップ／置いたキャラをタップで戻す）<br>配置待ち：'+(S.queue.map(t=>ST[t].e+ST[t].n).join('、')||'なし')+'<br>'
   +`<button ${S.queue.length?'disabled':''} onclick="nextStep()">${S.mode=='pvp'&&S.who=='a'?'プレイヤー2の準備へ':'戦闘開始！'}</button><button onclick="S.U=S.U.filter(x=>x.s!=S.who);S.ph='pick';render()">選び直す</button>`;
 }else if(S.ph=='battle'){
  const s=S.sel;
  if((S.mode=='pvp'||S.side=='a')&&!S.busy){
   if(s){const st=ST[s.t];h=`<b>${st.e}${st.n}</b> <span class="cl c-${st.cls}">${CLS[st.cls]}</span> HP${s.hp}/${s.max} 攻${st.atk} 防${st.def} 移${st.mv} 射${st.rng} ${stTxt(s)}<br>`;

function render(){
 let h='';

 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){

   +(u?`<div class="u ${u.s}${u.done&&S.ph=='battle'&&u.s==S.side?' dn':''}"><span class="${ST[u.t].dbl?'dbl':''}">${ST[u.t].e}</span><em>${u.hp}</em>${badge(u)}${((S.ph=='battle'||S.ph=='over')&&stTxt(u))?'<kbd class="tg2">'+stTxt(u)+'</kbd>':''}<b><i style="width:${u.hp/u.max*100}%"></i></b></div>`:'')+'</div>'}
 const mn=S.ph=='menu'||S.ph=='rules'||S.ph=='hand'||S.ph=='toss'||S.ph=='doc'||S.ph=='diff'||S.ph=='spirit'||S.ph=='opts'||S.ph=='corps'||S.ph=='hand2'||S.paused;document.getElementById('board').style.display=mn?'none':'grid';document.getElementById('legend').style.display=mn?'none':'block';document.getElementById('lg2').style.display=S.kind=='s'?'inline':'none';document.getElementById('board').innerHTML=h;const bd=document.getElementById('board');bd.className='t-'+MP.t;document.getElementById('docs').innerHTML='';document.getElementById('timer').style.display=(S.ph=='battle'&&!S.paused)?'block':'none';updTimer();bd.style.gridTemplateColumns='repeat('+COLS+',var(--s))';bd.style.gridTemplateRows='repeat('+ROWS+',var(--s))';bd.style.setProperty('--s','min('+(92/COLS)+'vw,'+Math.floor((COLS>10?700:540)/COLS)+'px)');

async function tfSignOut(){await tfClient.auth.signOut();tfUser=null;tfRoom=null;tfSide=null;if(tfChannel)await tfClient.removeChannel(tfChannel);tfChannel=null;document.getElementById('roomInfo').style.display='none';tfShowAuth();tfMsg('ログアウトしました。');}
async function tfCreateRoom(){if(!tfUser)return;tfMsg('ルームを作成中…');const {data,error}=await tfClient.rpc('tf_create_room');if(error)return tfMsg('作成エラー：'+error.message);tfRoom=data[0].id;tfRoomCode=data[0].code;tfSide='a';tfShowRoom();tfSubscribeRoom();}
async function tfJoinRoom(){if(!tfUser)return;const code=document.getElementById('joinCode').value.trim().toUpperCase();if(!/^\d{6}$/.test(code))return tfMsg('6桁のルームコードを入力してね。');tfMsg('参加中…');const {data,error}=await tfClient.rpc('tf_join_room',{p_code:code});if(error)return tfMsg('参加できません：'+error.message);tfRoom=data[0].id;tfRoomCode=data[0].code;tfSide='b';tfShowRoom();tfSubscribeRoom();}
function tfShowRoom(){document.getElementById('roomInfo').style.display='block';document.getElementById('roomCode').textContent=tfRoomCode;document.getElementById('roomStatus').textContent=tfSide==='a'?'あなたは紫軍（プレイヤー1）。相手の参加を待っています。':'参加しました！ホストがゲームを開始するまで待ってね。';document.getElementById('startOnlineBtn').style.display=tfSide==='a'?'block':'none';document.getElementById('startOnlineBtn').disabled=true;tfMsg('ルーム準備完了。相手が参加すると開始できます。');}
async function tfSubscribeRoom(){if(tfChannel)await tfClient.removeChannel(tfChannel);tfChannel=tfClient.channel('tf-room-'+tfRoom).on('postgres_changes',{event:'UPDATE',schema:'public',table:'tf_game_rooms',filter:'id=eq.'+tfRoom},payload=>{const row=payload.new;if(row.updated_by===tfUser?.id)return;if(row.guest_id&&tfSide==='a'){document.getElementById('roomStatus').textContent='対戦相手が参加しました。ゲームを開始できます！';document.getElementById('startOnlineBtn').disabled=false;}if(row.state){tfApplyState(row.state);document.getElementById('onlineGate').style.display='none';tfMsg('対戦状態を同期しました。');}}).subscribe();const {data,error}=await tfClient.from('tf_game_rooms').select('*').eq('id',tfRoom).single();if(!error&&data?.state&&S?.ph==='battle')tfApplyState(data.state);if(!error&&data?.guest_id&&tfSide==='a'){document.getElementById('roomStatus').textContent='対戦相手が参加しました。ゲームを開始できます！';document.getElementById('startOnlineBtn').disabled=false;}}
function tfPackState(){const ids=new Map((S.U||[]).map((u,i)=>[u,i]));return JSON.parse(JSON.stringify({...S,sel:S.sel?{__unit:ids.get(S.sel)}:null,insp:S.insp?{__unit:ids.get(S.insp)}:null,tg:Array.isArray(S.tg)?S.tg.map(u=>ids.get(u)).filter(Number.isInteger):S.tg,reachSet:S.reachSet instanceof Map?{__map:[...S.reachSet]}:null}));}
function tfUnpackState(raw){const x=raw;if(!x||!Array.isArray(x.U))return null;x.sel=x.sel&&x.sel.__unit!=null?x.U[x.sel.__unit]:null;x.insp=x.insp&&x.insp.__unit!=null?x.U[x.insp.__unit]:null;if(Array.isArray(x.tg))x.tg=x.tg.map(i=>x.U[i]).filter(Boolean);if(x.reachSet?.__map)x.reachSet=new Map(x.reachSet.__map);return x;}
async function tfWriteState(){if(!tfRoom||!tfUser||!S||tfApplying||!['battle','over'].includes(S.ph))return;const state=tfPackState(),stamp=JSON.stringify(state);if(stamp===tfLastStamp)return;tfLastStamp=stamp;const {error}=await tfClient.rpc('tf_update_room_state',{p_room_id:tfRoom,p_state:state});if(error)tfMsg('同期エラー：'+error.message);}
function tfScheduleSave(){if(!tfRoom||tfApplying)return;clearTimeout(tfSaveTimer);tfSaveTimer=setTimeout(tfWriteState,180);}
function tfApplyState(raw){const next=tfUnpackState(raw);if(!next)return;tfApplying=true;S=next;applyMap(MAPI);render();tfApplying=false;tfLastStamp=JSON.stringify(tfPackState());}
const tfOriginalRender=render;render=function(){tfOriginalRender();tfScheduleSave();};
const tfOriginalOnCell=onCell;onCell=function(r,c){if(tfRoom&&S?.ph==='battle'&&S.side!==tfSide){tfMsg('相手のターンです。操作できるまで待ってね。');return;}return tfOriginalOnCell(r,c);};
const tfOriginalTick=tick;tick=function(){if(tfRoom&&S?.ph==='battle'&&S.side!==tfSide)return;return tfOriginalTick();};
const tfOriginalEndTurn=endTurn;endTurn=function(){if(tfRoom&&S?.ph==='battle'&&S.side!==tfSide){tfMsg('相手のターンです。');return;}return tfOriginalEndTurn();};
const tfOriginalPanel=panel;panel=function(){if(tfRoom&&S?.ph==='battle'&&S.side!==tfSide)return '相手のターンです。操作が終わるまで待ってね。';return tfOriginalPanel();};
function tfStartOnline(){if(tfSide!=='a'||!tfRoom)return;TEAM=4;TURNS=10;MAPL=MAPS;MAPI=0;applyMap(0);init();S.mode='pvp';S.kind='t';S.ph='battle';S.first=Math.random()<.5?'a':'b';S.side=S.first;S.who='a';S.doc={a:'',b:''};S.sp={a:'',b:''};S.opt={n:4,doc:false,sp:false};S.U=[];S.turn=1;S.acts=0;S.lim=3;S.tl=90;S.paused=false;S.log=[];for(const side of ['a','b']){const zoneName=side==='a'?'A':'B',cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(zone(r,c)===zoneName&&!lake(r,c))cells.push([r,c]);cells.sort(()=>Math.random()-.5);for(let i=0;i<4;i++){const t=KEYS[(Math.random()*KEYS.length)|0],[r,c]=cells[i];S.U.push(mk(t,side,r,c));}}S.U.forEach(u=>u.uid=crypto.randomUUID());startBattle();tfWriteState();document.getElementById('onlineGate').style.display='none';tfMsg('ゲーム開始！あなたは紫軍です。');}
tfClient.auth.onAuthStateChange((_event,session)=>{tfUser=session?.user||null;tfShowAuth();});
tfRefreshSession();

</script></body></html>
